name: Feature or change
description: Something the product should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome for the person using it, not the implementation.
        Title: one plain sentence saying the outcome. Add the module or area label after filing.
        If someone has to decide first, file a Question instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today, and who is affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes. Each line should be testable.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this deliberately does not change.
  - type: textarea
    id: refs
    attributes:
      label: Refs
      description: The spec requirement, related issues, where the numbers came from.
