name: Bug
description: Something that worked, or should work, doesn't.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Search first; add a 👍 to an existing issue instead of a duplicate.
        Title: one plain sentence saying what is wrong. Add the module or area label after filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, where, and how to make it happen again. Paste the error if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead. Each line should be testable.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this deliberately does not change.
  - type: textarea
    id: refs
    attributes:
      label: Refs
      description: The spec requirement, related issues, where the numbers came from.
